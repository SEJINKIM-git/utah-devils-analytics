name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  platform:
    name: 분석 플랫폼 (Next.js)
    runs-on: ubuntu-latest
    env:
      # 빌드·테스트용 가짜 값 — 운영 DB에 접속하지 않는다.
      # 주소는 E2E용 가짜 Supabase(tests/e2e/mock-supabase.mjs, 가상 선수 기록)다
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
      SUPABASE_SERVICE_KEY: ci
      OPENAI_API_KEY: ci
      ADMIN_SESSION_SECRET: ci-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - name: 인증 스모크 테스트 + 화면 흐름 (Playwright)
        run: |
          node tests/e2e/mock-supabase.mjs &
          npx next start -p 3100 &
          npx --yes wait-on@8 http://localhost:3100/login http://127.0.0.1:54321/rest/v1/players
          BASE_URL=http://localhost:3100 node tests/e2e/auth-smoke.mjs
          # 러너에 설치돼 있는 Chrome을 쓴다 (Playwright 내장 브라우저는 이 러너 OS를 지원하지 않는다)
          BASE_URL=http://localhost:3100 PW_CHANNEL=chrome node tests/e2e/ui-flows.mjs

  console:
    name: 운영 콘솔 (Streamlit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: console/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
